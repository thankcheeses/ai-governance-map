<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <!-- No maximum-scale: pinch-zoom is how low-vision readers read a map key. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Governance Map — which AI law binds which country</title>
    <meta
      name="description"
      content="An interactive world map of binding AI law. See which instrument binds each country and US state, what it requires and when. Each entry shows the source it was checked against, and entries with no source recorded are marked." />
    <link rel="canonical" href="https://thankcheeses.github.io/ai-governance-map/" />

    <!-- Icons. Every path carries the base URL: the site is served from a
         sub-path, and a bare "/icon.png" resolves to the wrong host root. -->
    <link rel="icon" href="%BASE_URL%favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="theme-color" content="#04070E" />
    <meta name="color-scheme" content="dark light" />

    <!-- Link previews. Absolute URLs: crawlers do not resolve relative ones. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AI Governance Map" />
    <meta property="og:title" content="AI Governance Map — which AI law binds which country" />
    <meta
      property="og:description"
      content="An interactive world map of binding AI law. Each entry shows the source it was checked against, and entries with no source recorded are marked." />
    <meta property="og:url" content="https://thankcheeses.github.io/ai-governance-map/" />
    <meta property="og:image" content="https://thankcheeses.github.io/ai-governance-map/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A world map with Europe, China, India, South Korea and Vietnam coloured by the AI law that binds them." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AI Governance Map — which AI law binds which country" />
    <meta
      name="twitter:description"
      content="An interactive world map of binding AI law. Each entry shows the source it was checked against, and entries with no source recorded are marked." />
    <meta name="twitter:image" content="https://thankcheeses.github.io/ai-governance-map/og-image.png" />

    <!-- Theme before first paint: a stored choice wins, otherwise the device's.
         Mirrors ThemeContext, so React mounts into the theme already showing. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          if (t === 'dark') document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = t;
        } catch (e) {}
      })();
    </script>
    <!-- Self-hosted. These faces were the last external host the site contacted;
         serving them from our own origin means a page load reaches nothing outside it. -->
    <link href="%BASE_URL%fonts/fonts.css" rel="stylesheet" />

    <!--
      Stale-index recovery.

      Asset filenames carry a content hash, and each Pages deploy replaces the
      whole site, so the previous deploy's bundles stop existing. A browser
      still holding a cached index.html therefore asks for filenames that are
      gone, gets 404s, and renders nothing at all — a blank page that looks
      exactly like a broken deploy even though the server is serving the right
      thing. A soft refresh often revalidates lazily and stays blank, so the
      only cure has been knowing to hard-reload.

      Resource errors do not bubble, so this listens in the capture phase. On a
      missing bundle it reloads once against a URL the cache has never seen.
      The guard is cleared only once the app actually mounts (see main.tsx), so
      an asset that is genuinely missing fails once and stops rather than
      looping forever.

      Inline on purpose: it has to run even when every other file 404s.
    -->
    <script>
      (function () {
        window.__AGM_STALE_KEY = 'agm:stale-index-reload';
        window.addEventListener(
          'error',
          function (e) {
            var el = e.target;
            if (!el || el === window) return;
            if (el.tagName !== 'SCRIPT' && el.tagName !== 'LINK') return;
            var href = el.src || el.href || '';
            if (href.indexOf('/assets/') === -1 && href.indexOf('/fonts/') === -1) return;
            try {
              if (sessionStorage.getItem(window.__AGM_STALE_KEY)) return;
              sessionStorage.setItem(window.__AGM_STALE_KEY, '1');
            } catch (err) {
              return; // No sessionStorage means no loop guard, so do nothing.
            }
            var sep = location.search ? '&' : '?';
            location.replace(
              location.pathname + location.search + sep + 'agm-refresh=' + Date.now() + location.hash
            );
          },
          true
        );
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>

</html>
