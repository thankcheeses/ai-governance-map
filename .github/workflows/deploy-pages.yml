name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Build-only validation on PRs (the deploy job is gated to push below), so a PR
  # that would break the Pages build fails here rather than after merge. This keeps
  # the build check that the removed webpack.yml used to provide.
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: read the repo, and mint the OIDC token deploy-pages needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. Queue rather than cancel, so an in-flight
# deployment is allowed to finish instead of leaving Pages half-updated.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version comes from the "packageManager" field in package.json (pnpm@10.4.1).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm check

      # Vite base is "/ai-governance-map/" and the build emits 404.html for the
      # SPA fallback plus .nojekyll (from client/public) into dist/public.
      - name: Build
        run: pnpm build

      # Pages-specific steps only on real deploys. On a pull request the job stops at
      # the build above, so PR validation never depends on Pages being enabled for the
      # repository (it would otherwise fail for a reason unrelated to the change).
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist/public

  deploy:
    name: Deploy
    needs: build
    # Never publish from a pull request — deploy only for pushes to main and manual runs.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
